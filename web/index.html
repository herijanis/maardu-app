<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Maardu Gümnaasiumi 11.erh tunniplaan">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="11.erh">
  <title>11.erh tunniplaan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>11.erh</h1>
        <span class="school">Maardu Gümnaasium</span>
      </div>
      <div class="meta">
        <button id="groupBtn" class="pill pill-group" hidden aria-label="Minu grupp">G?</button>
        <span id="updated" class="updated">Laadin…</span>
        <button id="refreshBtn" class="icon-btn" aria-label="Värskenda" title="Värskenda">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div id="stalePill" class="stale" role="status" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Vaade">
      <span class="tab-ind" aria-hidden="true"></span>
      <button role="tab" class="tab" data-view="day" aria-selected="true">Päev</button>
      <button role="tab" class="tab" data-view="week" aria-selected="false">Nädal</button>
    </nav>

    <main>
      <section id="view-day" class="view is-active" aria-label="Päeva tunniplaan">
        <div class="daynav">
          <button class="icon-btn" id="prevDay" aria-label="Eelmine päev"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="daytitle">
            <div id="dayName" class="dayname"></div>
            <div id="dayDate" class="daydate"></div>
          </div>
          <button class="icon-btn" id="nextDay" aria-label="Järgmine päev"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div id="dayStrip" class="daystrip"></div>
        <div id="dayBody" class="daybody">
          <ol id="slots" class="slots"></ol>
        </div>
      </section>

      <section id="view-week" class="view" aria-label="Nädala tunniplaan">
        <div class="daynav">
          <button class="icon-btn" id="prevWeek" aria-label="Eelmine nädal"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="daytitle">
            <div id="weekName" class="dayname"></div>
            <div id="weekRange" class="daydate"></div>
          </div>
          <button class="icon-btn" id="nextWeek" aria-label="Järgmine nädal"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div id="weekGrid" class="weekgrid"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>

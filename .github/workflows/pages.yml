name: Timetable → GitHub Pages

# Refetches the 11.erh timetable and deploys web/ + data/*.json to GitHub Pages (team/reliability.md).
# Slots: 07:00, 12:00 and 19:00 Europe/Tallinn. GitHub cron is UTC-only, so the cron covers both UTC offsets
# and the gate works in Tallinn time: a scheduled run goes ahead only within 2.5h after a slot, and only
# while that slot has no success yet (a marker in the Actions cache). That gives an attempt every 20 min for
# ~2h per slot, each usually on a runner with a different IP (EduPage times out from some of them).
# Data: the fresh fetch, else the NEWEST valid copy of {Mac `snapshots` branch, Actions cache, live site}.
on:
  schedule:
    - cron: '0,20,40 4-7,9-12,16-19 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was started (the Mac backup passes "mac backup")
        required: false
      simulate_edupage_down:
        description: Test the fallback path (the EduPage fetch fails on purpose)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Find the current slot
        id: slot
        run: |
          mins=$((10#$(TZ=Europe/Tallinn date +%H) * 60 + 10#$(TZ=Europe/Tallinn date +%M)))
          day=$(TZ=Europe/Tallinn date +%F)
          slot=
          for h in 19 12 7; do
            if [ "$mins" -ge $((h * 60)) ]; then slot=$(printf '%sT%02d' "$day" "$h"); since=$((mins - h * 60)); break; fi
          done
          if [ -z "$slot" ]; then slot="$(TZ=Europe/Tallinn date -d yesterday +%F)T19"; since=$((mins + 1440 - 1140)); fi
          echo "slot $slot, $since min ago"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Has this slot already succeeded?
        id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .slot-ok
          key: slot-ok-${{ steps.slot.outputs.slot }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SINCE: ${{ steps.slot.outputs.since }}
          DONE: ${{ steps.done.outputs.cache-hit }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            if [ "$SINCE" -gt 150 ]; then run=false; echo "outside the retry window"; fi
            if [ "$DONE" = true ]; then run=false; echo "slot already succeeded"; fi
          fi
          echo "run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Parser tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore last good timetable (Actions cache)
        uses: actions/cache/restore@v6
        with:
          path: last-good/timetable.json
          key: timetable-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timetable-

      - name: Get the Mac's snapshot and the live site's copy
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p candidates
          if git fetch -q --depth=1 origin snapshots 2>/dev/null; then
            git show FETCH_HEAD:data/timetable.json > candidates/mac.json || rm -f candidates/mac.json
          fi
          curl -fsSL --max-time 30 "$BASE_URL/data/timetable.json?t=$(date +%s)" -o candidates/live.json || rm -f candidates/live.json
          ls -la candidates last-good 2>/dev/null || true

      - name: Fetch timetable from EduPage
        id: fetch
        continue-on-error: true
        env:
          TIMETABLE_SOURCE: actions
          SIMULATE_EDUPAGE_DOWN: ${{ inputs.simulate_edupage_down && '1' || '' }}
        run: npm run timetable

      - name: Choose the newest valid data and build the site
        id: publish
        run: |
          rm -rf _site
          cp -R web _site
          node timetable/publish.js --out _site/data --keep last-good/timetable.json \
            --fetch-status data/status.json \
            --candidate actions=data/timetable.json \
            --candidate mac=candidates/mac.json \
            --candidate cache=last-good/timetable.json \
            --candidate cache=candidates/live.json
          cat _site/data/status.json

      - name: Save last good timetable
        uses: actions/cache/save@v6
        with:
          path: last-good/timetable.json
          key: timetable-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark the slot as done
        if: steps.publish.outputs.fresh == 'true'
        run: mkdir -p .slot-ok && echo "${{ steps.publish.outputs.source }} ${{ steps.publish.outputs.lastOk }}" > .slot-ok/done

      - name: Save slot marker
        if: steps.publish.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: .slot-ok
          key: slot-ok-${{ steps.publish.outputs.slot }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

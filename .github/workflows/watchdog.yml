name: Timetable watchdog

# Every 3h: checks the LIVE site (not the Pages workflow's own state), so a broken deploy is caught too.
# No successful fetch for 12h → opens the "Tunniplaan ei uuene" issue (the owner is mentioned and gets an email);
# closes it on recovery. The Pages workflow runs the same check after every deploy.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      fake_last_ok:
        description: Test the alarm by pretending the live data was last fetched at this time (ISO), e.g. 2026-09-28T07:00:00+03:00
        required: false

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the live site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALARM_MENTION: ${{ github.repository_owner }}
          FAKE_LAST_OK: ${{ inputs.fake_last_ok }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node timetable/watchdog.js "$(echo "$SITE" | tr A-Z a-z)"
